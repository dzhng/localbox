name: Localbox release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to package and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: localbox-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      LOCALBOX_KERNEL_URL: ${{ vars.LOCALBOX_KERNEL_URL }}
      LOCALBOX_INITRD_URL: ${{ vars.LOCALBOX_INITRD_URL }}
      LOCALBOX_TEMPLATE_DISK_URL: ${{ vars.LOCALBOX_TEMPLATE_DISK_URL }}
      LOCALBOX_KERNEL_SHA256: ${{ vars.LOCALBOX_KERNEL_SHA256 }}
      LOCALBOX_INITRD_SHA256: ${{ vars.LOCALBOX_INITRD_SHA256 }}
      LOCALBOX_TEMPLATE_DISK_SHA256: ${{ vars.LOCALBOX_TEMPLATE_DISK_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Validate release inputs
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.LOCALBOX_RELEASE_PRIVATE_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.LOCALBOX_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v${RELEASE_TAG#v}"
          test -n "$RELEASE_PRIVATE_KEY"
          test -n "$RELEASE_PUBLIC_KEY"
          for value in LOCALBOX_KERNEL_URL LOCALBOX_INITRD_URL LOCALBOX_TEMPLATE_DISK_URL LOCALBOX_KERNEL_SHA256 LOCALBOX_INITRD_SHA256 LOCALBOX_TEMPLATE_DISK_SHA256; do
            test -n "${!value}" || { echo "$value is required" >&2; exit 1; }
          done
      - name: Download pinned VM artifacts
        run: |
          set -euo pipefail
          fetch() { curl --fail --location --retry 3 --output "$2" "$1"; echo "$3  $2" | shasum -a 256 -c -; }
          fetch "$LOCALBOX_KERNEL_URL" kernel "$LOCALBOX_KERNEL_SHA256"
          fetch "$LOCALBOX_INITRD_URL" initrd "$LOCALBOX_INITRD_SHA256"
          fetch "$LOCALBOX_TEMPLATE_DISK_URL" template.img "$LOCALBOX_TEMPLATE_DISK_SHA256"
      - name: Build signed release
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.LOCALBOX_RELEASE_PRIVATE_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.LOCALBOX_RELEASE_PUBLIC_KEY }}
          RELEASE_KEY_ID: ${{ vars.LOCALBOX_RELEASE_KEY_ID || 'github' }}
          LOCALBOX_SIGNING_P12: ${{ runner.temp }}/localbox-release.p12
          LOCALBOX_SIGNING_P12_PASSWORD_FILE: ${{ runner.temp }}/localbox-release-password.txt
          LOCALBOX_KERNEL: ${{ github.workspace }}/kernel
          LOCALBOX_INITRD: ${{ github.workspace }}/initrd
          LOCALBOX_TEMPLATE_DISK: ${{ github.workspace }}/template.img
          VERSION: ${{ env.RELEASE_TAG }}
          IMAGE_DIGEST: ${{ vars.LOCALBOX_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_PRIVATE_KEY" > "$RUNNER_TEMP/release-private.pem"
          export RELEASE_PRIVATE_KEY="$RUNNER_TEMP/release-private.pem"
          DERIVED_PUBLIC_KEY=$(node --input-type=module -e 'import { readFileSync, createPublicKey } from "node:crypto"; process.stdout.write(createPublicKey(readFileSync(process.env.RELEASE_PRIVATE_KEY)).export({ type: "spki", format: "pem" }).toString())')
          test "$DERIVED_PUBLIC_KEY" = "$RELEASE_PUBLIC_KEY" || { echo 'LOCALBOX_RELEASE_PUBLIC_KEY does not match LOCALBOX_RELEASE_PRIVATE_KEY' >&2; exit 1; }
          printf '%s' '${{ secrets.LOCALBOX_RELEASE_IDENTITY_P12_B64 }}' | base64 --decode > "$LOCALBOX_SIGNING_P12"
          printf '%s' '${{ secrets.LOCALBOX_RELEASE_IDENTITY_PASSWORD }}' > "$LOCALBOX_SIGNING_P12_PASSWORD_FILE"
          test -n "${IMAGE_DIGEST:-}" || { echo 'LOCALBOX_IMAGE_DIGEST is required' >&2; exit 1; }
          VERSION="${VERSION#v}" scripts/release.sh dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localbox-release
          path: dist/release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: localbox-release
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/Localbox-*.zip release/localbox-cli-*.tar.gz release/release.json release/SHA256SUMS --verify-tag --generate-notes --title "Localbox ${RELEASE_TAG#v}"
